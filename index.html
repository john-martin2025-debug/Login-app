<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 32px 28px;
        }
        .logo-slot {
            height: 64px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #d4d4d4;
            border-radius: 8px;
            color: #737373;
            font-size: 0.85rem;
        }
        .logo-slot img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        h1 { font-size: 1.4rem; margin-bottom: 6px; text-align: center; color: #000000; }
        .subtitle { font-size: 0.9rem; color: #525252; text-align: center; margin-bottom: 22px; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input {
            padding: 11px 12px;
            border-radius: 6px;
            border: 1px solid #d4d4d4;
            background: #ffffff;
            color: #111111;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: #000000; }
        .row-right { text-align: right; margin-top: -4px; }
        .link-btn {
            background: none;
            border: none;
            color: #000000;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }
        button.primary {
            padding: 11px;
            border: 1px solid #000000;
            border-radius: 6px;
            background: #000000;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button.primary:hover { background: #262626; }
        button.secondary {
            padding: 10px;
            border: 1px solid #000000;
            border-radius: 6px;
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            cursor: pointer;
        }
        button.secondary:hover { background: #f5f5f5; }
        button.danger {
            padding: 10px;
            border: 1px solid #d4d4d4;
            border-radius: 6px;
            background: #ffffff;
            color: #111111;
            cursor: pointer;
        }
        button.danger:hover { border-color: #000000; background: #000000; color: #ffffff; }
        .footer-text {
            margin-top: 18px;
            text-align: center;
            font-size: 0.88rem;
            color: #525252;
        }
        .divider { height: 1px; background: #e5e5e5; margin: 18px 0; }
        .badge {
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #404040;
        }
        .badge strong { color: #000000; }
        #message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
        }
        #message.success { display: block; background: #f5f5f5; color: #111111; border: 1px solid #000000; }
        #message.error { display: block; background: #111111; color: #ffffff; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-slot">
            <!-- Replace with: <img src="logo.png" alt="Logo" /> -->
            Logo
        </div>

        <div id="loginView">
            <h1>Sign In</h1>
            <p class="subtitle">Enter your credentials to continue</p>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <div class="row-right">
                    <button class="link-btn" id="goToForgot" type="button">Forgot password?</button>
                </div>
                <button class="primary" type="submit">Sign In</button>
            </form>

            <p class="footer-text">
                Don't have an account? <button class="link-btn" id="goToSignup" type="button">Sign up</button>
            </p>
        </div>

        <div id="signupView" class="hidden">
            <h1>Create Account</h1>
            <p class="subtitle">Sign up to get started</p>

            <form id="signupForm">
                <input type="email" id="signupEmail" placeholder="Email" required />
                <input type="password" id="signupPassword" placeholder="Password" required />
                <button class="primary" type="submit">Sign Up</button>
            </form>

            <p class="footer-text">
                Already have an account? <button class="link-btn" id="goToLoginFromSignup" type="button">Sign in</button>
            </p>
        </div>

        <div id="forgotView" class="hidden">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email and a new password</p>

            <form id="forgotForm">
                <input type="email" id="resetEmail" placeholder="Registered Email" required />
                <input type="password" id="resetPassword" placeholder="New Password" required />
                <button class="primary" type="submit">Reset Password</button>
            </form>

            <p class="footer-text">
                Remembered it? <button class="link-btn" id="goToLoginFromForgot" type="button">Sign in</button>
            </p>
        </div>

        <div id="dashboardView" class="hidden">
            <h1>Account</h1>
            <p class="subtitle">Manage your profile</p>

            <div class="badge">
                Signed in as <strong id="userEmail"></strong> (ID: <span id="userId"></span>)
            </div>

            <form id="updateForm">
                <input type="password" id="newPassword" placeholder="New Password" required />
                <button class="primary" type="submit">Update Password</button>
            </form>

            <div class="divider"></div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="secondary" id="logoutBtn" type="button">Log Out</button>
                <button class="danger" id="deleteBtn" type="button">Delete Account</button>
            </div>
        </div>

        <p id="message"></p>
    </div>

    <script>
        const API = 'http://localhost:3000';
        let currentUser = null;

        const views = {
            login: document.getElementById('loginView'),
            signup: document.getElementById('signupView'),
            forgot: document.getElementById('forgotView'),
            dashboard: document.getElementById('dashboardView')
        };
        const message = document.getElementById('message');

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = isError ? 'error' : 'success';
        }

        function clearMessage() {
            message.textContent = '';
            message.className = '';
        }

        function switchView(target) {
            Object.keys(views).forEach(key => {
                views[key].classList.toggle('hidden', key !== target);
            });
            clearMessage();
        }

        document.getElementById('goToSignup').addEventListener('click', () => switchView('signup'));
        document.getElementById('goToForgot').addEventListener('click', () => switchView('forgot'));
        document.getElementById('goToLoginFromSignup').addEventListener('click', () => switchView('login'));
        document.getElementById('goToLoginFromForgot').addEventListener('click', () => switchView('login'));

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch(`${API}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('signupForm').reset();
                    switchView('login');
                    showMessage(`${data.message}. You can now sign in.`);
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    currentUser = data.user;
                    document.getElementById('userEmail').textContent = currentUser.email;
                    document.getElementById('userId').textContent = currentUser.id;
                    document.getElementById('loginForm').reset();
                    switchView('dashboard');
                    showMessage(data.message);
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const newPassword = document.getElementById('resetPassword').value;

            try {
                const res = await fetch(`${API}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('forgotForm').reset();
                    switchView('login');
                    showMessage(data.message);
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API}/users/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                showMessage(res.ok ? data.message : data.error, !res.ok);
                if (res.ok) document.getElementById('updateForm').reset();
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            switchView('login');
            showMessage('Logged out');
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!confirm('Delete your account permanently?')) return;

            try {
                const res = await fetch(`${API}/users/${currentUser.id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (res.ok) {
                    currentUser = null;
                    switchView('login');
                    showMessage(data.message);
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });
    </script>
</body>
</html>
