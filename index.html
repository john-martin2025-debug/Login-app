<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login App</title>
</head>
<body>
    <h2>Sign Up</h2>
    <form id="signupForm">
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button type="submit">Sign Up</button>
    </form>

    <hr />

    <h2>Login</h2>
    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>

    <hr />

    <h2>Update Password</h2>
    <form id="updateForm">
        <input type="number" id="updateUserId" placeholder="User ID" required />
        <input type="password" id="newPassword" placeholder="New Password" required />
        <button type="submit">Update Password</button>
    </form>

    <hr />

    <h2>Delete Account</h2>
    <form id="deleteForm">
        <input type="number" id="deleteUserId" placeholder="User ID" required />
        <button type="submit">Delete Account</button>
    </form>

    <p id="message"></p>

    <script>
        const message = document.getElementById('message');

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch('http://localhost:3000/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                message.textContent = res.ok ? data.message : data.error;
            } catch (err) {
                message.textContent = 'Could not reach server';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    message.textContent = `${data.message} (User ID: ${data.user.id})`;
                    document.getElementById('updateUserId').value = data.user.id;
                    document.getElementById('deleteUserId').value = data.user.id;
                } else {
                    message.textContent = data.error;
                }
            } catch (err) {
                message.textContent = 'Could not reach server';
            }
        });

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('updateUserId').value;
            const password = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`http://localhost:3000/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                message.textContent = res.ok ? data.message : data.error;
            } catch (err) {
                message.textContent = 'Could not reach server';
            }
        });

        document.getElementById('deleteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('deleteUserId').value;

            try {
                const res = await fetch(`http://localhost:3000/users/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                message.textContent = res.ok ? data.message : data.error;
            } catch (err) {
                message.textContent = 'Could not reach server';
            }
        });
    </script>
</body>
</html>
