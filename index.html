<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
        }
        .tab.active { background: #3b82f6; color: #fff; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input {
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button.primary {
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button.primary:hover { background: #2563eb; }
        button.danger {
            padding: 11px;
            border: 1px solid #ef4444;
            border-radius: 8px;
            background: transparent;
            color: #f87171;
            font-weight: 600;
            cursor: pointer;
        }
        button.danger:hover { background: #ef4444; color: #fff; }
        button.secondary {
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
        }
        .divider { height: 1px; background: #334155; margin: 18px 0; }
        .badge {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .badge strong { color: #f8fafc; }
        #message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        #message.success { display: block; background: #064e3b; color: #a7f3d0; }
        #message.error { display: block; background: #7f1d1d; color: #fecaca; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login App</h1>

        <div id="authView">
            <div class="tabs">
                <button class="tab active" id="loginTab" type="button">Login</button>
                <button class="tab" id="signupTab" type="button">Sign Up</button>
            </div>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <button class="primary" type="submit">Login</button>
            </form>

            <form id="signupForm" class="hidden">
                <input type="email" id="signupEmail" placeholder="Email" required />
                <input type="password" id="signupPassword" placeholder="Password" required />
                <button class="primary" type="submit">Create Account</button>
            </form>
        </div>

        <div id="dashboardView" class="hidden">
            <div class="badge">
                Signed in as <strong id="userEmail"></strong> (ID: <span id="userId"></span>)
            </div>

            <form id="updateForm">
                <input type="password" id="newPassword" placeholder="New Password" required />
                <button class="primary" type="submit">Update Password</button>
            </form>

            <div class="divider"></div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="secondary" id="logoutBtn" type="button">Log Out</button>
                <button class="danger" id="deleteBtn" type="button">Delete Account</button>
            </div>
        </div>

        <p id="message"></p>
    </div>

    <script>
        const API = 'http://localhost:3000';
        let currentUser = null;

        const authView = document.getElementById('authView');
        const dashboardView = document.getElementById('dashboardView');
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const message = document.getElementById('message');

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = isError ? 'error' : 'success';
        }

        function clearMessage() {
            message.textContent = '';
            message.className = '';
        }

        function setView(user) {
            currentUser = user;
            if (user) {
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userId').textContent = user.id;
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
            } else {
                dashboardView.classList.add('hidden');
                authView.classList.remove('hidden');
            }
        }

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            clearMessage();
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            clearMessage();
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch(`${API}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                showMessage(res.ok ? `${data.message}. You can now log in.` : data.error, !res.ok);
                if (res.ok) signupForm.reset();
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    setView(data.user);
                    showMessage(data.message);
                    loginForm.reset();
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API}/users/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                showMessage(res.ok ? data.message : data.error, !res.ok);
                if (res.ok) document.getElementById('updateForm').reset();
            } catch {
                showMessage('Could not reach server', true);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            setView(null);
            showMessage('Logged out');
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!confirm('Delete your account permanently?')) return;

            try {
                const res = await fetch(`${API}/users/${currentUser.id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (res.ok) {
                    setView(null);
                    showMessage(data.message);
                } else {
                    showMessage(data.error, true);
                }
            } catch {
                showMessage('Could not reach server', true);
            }
        });
    </script>
</body>
</html>
